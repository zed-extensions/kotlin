name: Release Proxy Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build proxy for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            asset: kotlin-lsp-proxy-darwin-aarch64.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15
            asset: kotlin-lsp-proxy-darwin-x86_64.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            asset: kotlin-lsp-proxy-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            asset: kotlin-lsp-proxy-linux-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: kotlin-lsp-proxy-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build proxy
        run: cargo build --release --target ${{ matrix.target }} --manifest-path proxy/Cargo.toml
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.asset }} \
            -C proxy/target/${{ matrix.target }}/release \
            kotlin-lsp-proxy
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path proxy/target/${{ matrix.target }}/release/kotlin-lsp-proxy.exe `
            -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-${{ matrix.target }}
          path: ${{ matrix.asset }}
          retention-days: 2

  release:
    name: Attach assets to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
