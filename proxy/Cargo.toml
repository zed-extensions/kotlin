[package]
name = "kotlin-lsp-proxy"
version = "0.4.0"
edition = "2021"
publish = false
license = "MIT"
description = "Stdio LSP proxy for the Zed Kotlin extension: materialize jar/zip definition targets"
repository = "https://github.com/zed-extensions/kotlin"
readme = "README.md"

[[bin]]
name = "kotlin-lsp-proxy"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
